name: Java CI/CD Pipeline with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Bước 3: Cấp quyền thực thi cho Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Bước 4: Kiểm tra cú pháp và biên dịch mã nguồn (Syntax & Compile Check)
      - name: Check syntax and compile code
        run: ./gradlew compileJava --info

      # Bước 5: Chạy các bài kiểm thử tự động (Unit / Integration Tests)
      - name: Run automated tests
        run: ./gradlew test

      # Bước 6: Đóng gói ứng dụng thành file thực thi JAR (Package)
      - name: Package Application (Build JAR)
        run: ./gradlew bootJar -x test

      # Bước 7: Lưu trữ file .jar lên GitHub Artifacts để phục vụ deploy/tải về
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-management-app-jar
          path: build/libs/*.jar
          retention-days: 7

      # Bước 8: Kiểm tra đóng gói Docker Image (Tùy chọn)
      - name: Build Docker Image
        run: |
          docker build -t student-management-api:${{ github.sha }} .
